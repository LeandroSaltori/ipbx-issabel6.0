; --- CONFIGURAÇÕES DE TRANSFERÊNCIA DE CHAMADAS (PRISMA TELECOM) ---
; Tempo limite para digitar os dígitos do ramal durante a transferência (em segundos)
transferdigittimeout = 7

; Tempo máximo de espera sem resposta em transferência assistida antes de retornar (em segundos)
atxfernoanswertimeout = 30

; Se a transferência assistida não for atendida, não derruba a chamada (retorna ao operador)
atxferdropcall = no
atxferloopdelay = 10
atxfercallbackretries = 2

; --- AJUSTES DE BIP DE TRANSFERÊNCIA ---
; BIP/Tom de cortesia emitido ao completar a transferência
courtesytone = beep
xfersound = beep
